# Settings for Clour Run
runConfig:
  minInstances: 1
  maxInstances: 10
  concurrency: 100
  cpu: 1 # in [1, 8]
  memoryMiB: 1024 # in [512, 32768]

env:
  # - variable: GOOGLE_API_KEY
  #   secret: googleAPIKey
  #   availability:
  #     - BUILD

  - variable: HOST
    value: 0.0.0.0
    availability:
      - BUILD
      - RUNTIME

  - variable: PORT
    value: 8080
    availability:
      - BUILD
      - RUNTIME

  - variable: NG_ALLOWED_HOSTS
    value: "pkspot.app"
    availability:
      - BUILD
      - RUNTIME

  # App Hosting's Angular adapter calls `npm run build`; force that path to stay production-only.
  - variable: PKSPOT_BUILD_CONFIGURATION
    value: "production"
    availability:
      - BUILD

  - variable: PKSPOT_SSR_FIREBASE_APP_ID
    value: "1:294969617102:web:08b892460adf0b16313e9f"
    availability:
      - RUNTIME
