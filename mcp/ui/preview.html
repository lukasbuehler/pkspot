<!doctype html><html><head><meta charset="utf-8"><title>PK Spot MCP UI local fixture preview</title><style>body{margin:0;font-family:system-ui;background:#eef1f7}h2{font-size:14px;padding:12px}iframe{border:0;background:white;width:100%;height:1100px;max-width:1000px;display:block;margin:auto}</style></head><body><h2>Local MCP host preview. Loads public content through the local Angular app.</h2><button onclick="document.querySelector('iframe').style.width='375px'">Narrow</button><button onclick="document.querySelector('iframe').style.width='100%'">Wide</button><button onclick="frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/host-context-changed',params:{theme:'dark'}},location.origin)">Dark</button><button onclick="frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{content:[],isError:true}},location.origin)">Error</button><button onclick="fixture={items:[]};sendFixture()">Empty</button><iframe src="ui-preview.html" title="PK Spot results"></iframe><script>
const frame=document.querySelector('iframe');
window.fixture={items:[{kind:'spot',id:'8CHFHRFUCozO9yeLEq6N',url:'https://pkspot.app/map/spots/8CHFHRFUCozO9yeLEq6N'}]};
window.sendFixture=()=>frame.contentWindow.postMessage({jsonrpc:'2.0',method:'ui/notifications/tool-result',params:{content:[],structuredContent:window.fixture}},location.origin);
addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;const m=e.data;if(m.method==='ui/initialize')frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{protocolVersion:m.params.protocolVersion,hostInfo:{name:'local-preview',version:'1'},hostCapabilities:{openLinks:{}},hostContext:{theme:'light',displayMode:'inline'}}},location.origin);if(m.method==='ui/notifications/initialized')window.sendFixture();if(m.method==='ui/open-link'){window.lastOpened=m.params.url;frame.contentWindow.postMessage({jsonrpc:'2.0',id:m.id,result:{}},location.origin);}});
</script></body></html>
