name: Tests

on:
  push:
    branches: [main, development]
  # PRs run CI only when their branch lives in this repository (maintainer,
  # agent and Dependabot branches). Every job checks this, so PRs from forks
  # never run workflows automatically; start those by hand after review.
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PKSPOT_LINT_CHUNK_SIZE: "40"
  PKSPOT_LINT_MAX_OLD_SPACE_MB: "4096"
  PKSPOT_VITEST_MAX_WORKERS: "2"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Functions dependencies
        run: npm ci --ignore-scripts --prefix functions

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            coverage/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          PKSPOT_CI_FIREBASE_API_KEY: ${{ secrets.PKSPOT_CI_FIREBASE_API_KEY }}

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          retention-days: 7

  lint:
    name: Lint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run lint
        run: npm run lint

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build and smoke-test SSR
        run: npm run test:build

  emulator-tests:
    name: Firebase Emulator Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Functions dependencies
        run: npm ci --ignore-scripts --prefix functions

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Verify Functions production dependencies
        run: |
          tmp_dir="$(mktemp -d)"
          cp functions/package.json functions/package-lock.json "$tmp_dir/"
          cp -R functions/lib "$tmp_dir/lib"
          npm ci --ignore-scripts --omit=dev --prefix "$tmp_dir"
          node -e "require('$tmp_dir/lib/functions/src/index.js'); console.log('functions module loaded')"

      - name: Install Playwright Chromium
        # The profile privacy suite drives the app in a browser.
        run: npx playwright install --with-deps chromium

      - name: Run the full emulator suite
        # The same aggregate the removed pre-push hook ran, so every
        # emulator suite in package.json runs on every PR and push.
        run: npm run test:emulator
        env:
          # The profile privacy suite starts the app, which needs the CI web config.
          PKSPOT_CI_FIREBASE_API_KEY: ${{ secrets.PKSPOT_CI_FIREBASE_API_KEY }}

      - name: Upload emulator logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firebase-emulator-logs
          path: |
            firebase-debug.log
            firestore-debug.log
            ui-debug.log
          retention-days: 7
