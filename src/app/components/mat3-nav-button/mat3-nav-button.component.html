@if (presentational()) {
<span class="button-container" [class.active]="active()">
  @if(image()) {
  <div class="image">
    <img [ngSrc]="image()!" width="24" height="24" class="rounded-circle" />
  </div>
  } @else {
  <mat-icon [class.material-symbols-rounded-outline]="isOutlineIcon()">{{
    icon()
  }}</mat-icon>
  }
  @if (liveIndicator()) {
    <span class="live-indicator" aria-hidden="true"></span>
  } @else if (badgeCount() > 0) {
    <span class="count-badge" aria-hidden="true">{{ badgeText() }}</span>
  }
  <span class="nav-label text-truncate w-100">
    {{ label() }}
  </span>
</span>
} @else {
<button
  class="button-container"
  [class.active]="active()"
  [attr.aria-label]="accessibleLabel()"
  [matMenuTriggerFor]="menu()"
>
  @if(image()) {
  <div class="image">
    <img [ngSrc]="image()!" width="24" height="24" class="rounded-circle" />
  </div>
  } @else {
  <mat-icon [class.material-symbols-rounded-outline]="isOutlineIcon()">{{
    icon()
  }}</mat-icon>
  }
  @if (liveIndicator()) {
    <span class="live-indicator" aria-hidden="true"></span>
  } @else if (badgeCount() > 0) {
    <span class="count-badge" aria-hidden="true">{{ badgeText() }}</span>
  }
  <span class="nav-label text-truncate w-100">
    {{ label() }}
  </span>
</button>
}
