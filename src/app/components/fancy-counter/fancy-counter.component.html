<span class="counter">
  @for(digit of displayDigits(); track digit + '-' + $index) {
  <span
    [@digitChange]="{
      value: number(),
      params: {
        incrementMinus: getMinusIfIncrementing(true),
        decrementMinus: getMinusIfIncrementing(false)
      }
    }"
    class="digit-container"
    >{{ digit }}</span
  >
  }
</span>
