@if (showControls()) {
  <div class="map-mini-fabs">
    @if (showResetNorth()) {
      <button
        mat-mini-fab
        type="button"
        color="primary"
        i18n-matTooltip
        matTooltip="Reset map orientation to north"
        matTooltipPosition="left"
        matTooltipShowDelay="500"
        (click)="resetNorth.emit()"
      >
        <mat-icon>north</mat-icon>
      </button>
    }

    <button
      mat-mini-fab
      type="button"
      color="primary"
      i18n-matTooltip
      [matTooltip]="
        mapStyle() === 'roadmap' ? 'Show satellite map' : 'Show roadmap'
      "
      matTooltipPosition="left"
      matTooltipShowDelay="500"
      (click)="toggleMapStyle.emit()"
    >
      <mat-icon>{{ mapStyle() === "roadmap" ? "landscape" : "map" }}</mat-icon>
    </button>

    <button
      mat-mini-fab
      type="button"
      color="primary"
      class="map-location-control"
      [class.map-location-control--disabled]="!locationEnabled()"
      [matTooltip]="geolocationTooltip()"
      matTooltipPosition="left"
      matTooltipShowDelay="500"
      [showProgress]="geolocationLoading() && locationEnabled()"
      (click)="focusGeolocation.emit()"
    >
      <mat-icon>{{ geolocationIcon() }}</mat-icon>
      <mat-progress-spinner
        progressIndicator
        mode="indeterminate"
        diameter="20"
        color="accent"
      />
    </button>
  </div>

  @if (createActions().length > 0) {
    <app-fab-menu
      id="mapCreateFabMenu"
      class="create-fab-menu"
      alignment="start"
      [actions]="createActions()"
      [matBadge]="draftCount()"
      [matBadgeHidden]="!draftCount()"
      [collapseSingleAction]="false"
      [launcherLabel]="createMenuLabel"
      (actionSelected)="onCreateAction($event)"
    />
  }
}
