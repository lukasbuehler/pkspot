@if (showControls()) {
  <div class="map-mini-fabs">
    @if (showResetNorth()) {
      <button
        mat-mini-fab
        type="button"
        color="primary"
        i18n-matTooltip
        matTooltip="Reset map orientation to north"
        matTooltipPosition="left"
        matTooltipShowDelay="500"
        (click)="resetNorth.emit()"
      >
        <mat-icon>north</mat-icon>
      </button>
    }

    <button
      mat-mini-fab
      type="button"
      color="primary"
      i18n-matTooltip
      [matTooltip]="
        mapStyle() === 'roadmap' ? 'Show satellite map' : 'Show roadmap'
      "
      matTooltipPosition="left"
      matTooltipShowDelay="500"
      (click)="toggleMapStyle.emit()"
    >
      <mat-icon>{{ mapStyle() === "roadmap" ? "landscape" : "map" }}</mat-icon>
    </button>

    <button
      mat-mini-fab
      type="button"
      color="primary"
      i18n-matTooltip
      matTooltip="Go to your location"
      matTooltipPosition="left"
      matTooltipShowDelay="500"
      (click)="focusGeolocation.emit()"
    >
      @if (geolocationLoading()) {
        <mat-progress-spinner
          mode="indeterminate"
          diameter="20"
          color="accent"
        ></mat-progress-spinner>
      } @else {
        <mat-icon>{{ geolocationIcon() }}</mat-icon>
      }
    </button>
  </div>

  @if (createActions().length > 0) {
    <app-fab-menu
      id="mapCreateFabMenu"
      class="create-fab-menu"
      alignment="start"
      [actions]="createActions()"
      [launcherLabel]="createMenuLabel"
      (actionSelected)="onCreateAction($event)"
    />
  }
}
