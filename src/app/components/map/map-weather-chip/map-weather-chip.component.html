<button
  mat-stroked-button
  type="button"
  class="map-weather-chip"
  [class.is-overview]="appearance() === 'overview'"
  [class.is-wet]="status() === 'wet'"
  [class.has-warning]="status() === 'warning'"
  [attr.aria-label]="accessibleLabel()"
  [matTooltip]="accessibleLabel()"
  [matTooltipPosition]="tooltipPosition()"
  (click)="pressed.emit()"
>
  <span class="chip-content">
    <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
    @if (temperature() !== undefined) {
      <strong class="temperature">{{ temperature() }}</strong>
    }
    <span class="separator" aria-hidden="true">⸱</span>
    <span class="change-summary">
      <span class="change-summary-text">{{ changeSummary().beforeTime }}</span>
      @if (changeSummary().time; as time) {
        <span class="change-summary-time">{{ time }}</span>
      }
      @if (changeSummary().afterTime; as afterTime) {
        <span class="change-summary-text">{{ afterTime }}</span>
      }
    </span>
  </span>
</button>
