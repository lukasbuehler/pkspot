<main class="map-overlay-visual-page">
  <section class="map-overlay-surface" aria-label="Map search overlay visual regression">
    <app-search-field></app-search-field>
    <app-filter-chips-bar
      [showSavedChip]="true"
      [showVisitedChip]="true"
      [showFiltersChip]="false"
    ></app-filter-chips-bar>
  </section>
  <section class="map-controls-surface" aria-label="Map controls fixture">
    <button type="button" class="sheet-toggle" (click)="sheetOpen.set(!sheetOpen())">Toggle sheet</button>
    <app-map-floating-controls
      [showControls]="true"
      [showCreateSpot]="!sheetOpen()"
      [showCreateEvent]="true"
    />
  </section>
</main>
