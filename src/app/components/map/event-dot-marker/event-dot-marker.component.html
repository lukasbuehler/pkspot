<div
  #eventMarker
  class="event-map-marker-collision-shell"
  [class.preview-enabled]="hoverPreviewActive()"
  [class.preview-visible]="effectivePreviewVisible()"
  [attr.aria-label]="ariaLabel()"
  [attr.title]="marker().name ?? 'Event'"
  (mouseenter)="showPreview()"
  (mouseleave)="hidePreview()"
>
  @if (hoverPreviewActive()) {
    <div class="event-map-marker-preview" (click)="onPreviewClick($event)">
      @if (marker().previewEvent; as event) {
        <app-event-card
          class="event-map-marker-preview-card"
          [event]="event"
          [compact]="true"
          [showRsvp]="false"
        ></app-event-card>
      } @else {
        <div class="event-map-marker-preview-fallback">
          <span class="mat-title-medium">{{ marker().name }}</span>
          @if (marker().description) {
            <p class="mat-body-small">{{ marker().description }}</p>
          }
        </div>
      }
      <svg
        class="event-map-marker-preview-tail"
        width="18"
        height="12"
        viewBox="0 0 18 12"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M6.88614 10.6061C7.4508 11.2455 7.73313 11.5653 8.04116 11.7336C8.63871 12.06 9.36129 12.06 9.95884 11.7336C10.2669 11.5653 10.5492 11.2455 11.1139 10.6061L16.1201 4.93655C17.1337 3.78859 17.6406 3.21461 17.7605 2.75071C17.9955 1.84214 17.5671 0.8924 16.7305 0.467134C16.3034 0.25 15.5377 0.25 14.0062 0.25H3.99378C2.46234 0.25 1.69663 0.25 1.26948 0.467134C0.432911 0.8924 0.00453424 1.84214 0.239482 2.75071C0.359444 3.21461 0.86627 3.78859 1.87992 4.93655L6.88614 10.6061Z"
        />
      </svg>
    </div>
  }
  <div
    class="event-map-marker"
    [class.event-map-marker-live]="isLive()"
    [style.background-color]="marker().imageBackgroundColor ?? 'var(--mat-sys-surface-container-highest)'"
  >
    @if(marker().imageSrc) {
    <img
      [src]="marker().imageSrc"
      [style.object-fit]="marker().imageFit ?? 'contain'"
      alt=""
      class="event-map-marker-logo"
    />
    } @else {
    <mat-icon class="event-map-marker-icon">{{ fallbackIcon() }}</mat-icon>
    }
  </div>
</div>

<map-advanced-marker
  [position]="marker().location"
  [content]="eventMarker"
  [title]="ariaLabel()"
  [gmpClickable]="true"
  [zIndex]="zIndex()"
  [options]="markerOptions()"
  (gmpClick)="markerClick.emit(marker())"
  (markerInitialized)="centerMarkerAnchor($event)"
></map-advanced-marker>
