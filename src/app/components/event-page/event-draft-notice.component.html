<aside
  class="draft-notice"
  aria-label="Draft event"
  i18n-aria-label="@@event_draft.notice.aria"
>
  <span class="draft-notice__icon" aria-hidden="true">
    <mat-icon>visibility_off</mat-icon>
  </span>
  <div>
    <p
      class="mat-title-small draft-notice__title"
      i18n="@@event_draft.notice.title"
    >Draft</p>
    <p
      class="mat-body-medium draft-notice__copy"
      i18n="@@event_draft.notice.description"
    >
      This event is not public. Only administrators can view it.
    </p>
  </div>
</aside>
