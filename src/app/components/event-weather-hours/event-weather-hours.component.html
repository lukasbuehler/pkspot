<section class="hourly-section">
  <h3 class="mat-title-medium" i18n="@@event_weather.hourly">
    Hourly forecast
  </h3>
  @if (hours().length > 0) {
    <app-hourly-forecast-strip [hours]="hours()" />
  } @else {
    <div class="hourly-unavailable" role="status">
      <mat-icon aria-hidden="true">cloud_off</mat-icon>
      <span i18n="@@event_weather.hourly_unavailable"
        >Hourly forecast is not available for this event day yet.</span
      >
    </div>
  }

  <a
    mat-button
    class="attribution"
    [href]="providerUrl()"
    target="_blank"
    rel="noopener noreferrer"
  >
    {{ attribution() }}
    <mat-icon>open_in_new</mat-icon>
  </a>
</section>
