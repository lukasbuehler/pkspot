<section class="discovery-toolbar" aria-label="Event discovery controls" i18n-aria-label>
  <div class="secondary-controls">
    @if (view() === "list") {
      <mat-button-toggle-group
        [value]="period()"
        aria-label="Event period"
        i18n-aria-label
        (change)="periodChange.emit($event.value)"
      >
        <mat-button-toggle value="upcoming" i18n>Upcoming</mat-button-toggle>
        <mat-button-toggle value="past" i18n>Past</mat-button-toggle>
      </mat-button-toggle-group>
    }

    @if (detailChips().length > 0) {
      <app-filter-chips-bar
        class="detail-filters"
        [presetFilters]="detailChips()"
        [selectedFilters]="selectedDetails()"
        [showFiltersChip]="false"
        [showClearChip]="false"
        appearance="solid"
        selectionRole="primary"
        ariaLabel="Filters"
        i18n-ariaLabel="@@filters_chip_label"
        (filterToggled)="toggleDetail($event)"
      />
    }

    @if (regionChips().length > 0) {
      <app-filter-chips-bar
        class="region-filters"
        [presetFilters]="regionChips()"
        [selectedFilters]="selectedRegions()"
        [showFiltersChip]="false"
        [showClearChip]="false"
        appearance="solid"
        selectionRole="primary"
        ariaLabel="Filter by region"
        i18n-ariaLabel
        (filterToggled)="toggleRegion($event)"
      />
    }

    @if (hasFilters()) {
      <button mat-button type="button" (click)="filtersCleared.emit()">
        <mat-icon>filter_alt_off</mat-icon>
        <span i18n>Clear filters</span>
      </button>
    }
  </div>
</section>
