@if (links().length > 0) {
  <div class="community-links">
    <h4 class="community-links-heading mat-title-small" i18n="@@community_links.spot_heading">
      {links().length, plural, =1 {Community} other {Communities}}
    </h4>
    <app-map-community-list
      [communities]="links()"
      (selectCommunity)="openCommunity($event)"
    />
  </div>
}
