<div
  #fabContainer
  class="fab-container"
  (mouseenter)="onMouseEnter()"
  (mouseleave)="onMouseLeave()"
>
  @let config = buttonConfig();
  <button
    mat-fab
    [extended]="$safeNavigationMigration(config?.mainButton?.isExtended)"
    class="sd-toggler"
    [color]="config?.mainButton?.color || 'primary'"
    [matTooltipDisabled]="!config?.mainButton?.tooltip || !openOnHover()"
    [matTooltip]="config?.mainButton?.tooltip || ''"
    [matTooltipPosition]="
      config?.tooltipPosition || defaultTooltipPosition
    "
    (click)="onMainClick()"
  >
    <mat-icon
      [@mainFabButtonIconRotation]="{
        value: isOpen() ? 'open' : 'closed',
        params: { degrees: rotationDegrees() }
      }"
      >{{ config?.mainButton?.icon ?? "add" }}</mat-icon
    >
    @if(config?.mainButton?.isExtended) {
    {{ config?.mainButton?.label }} }
  </button>
  @if(isOpen()) {
  <div
    class="mini-fab-container"
    [@speedDialStagger]="{ value: config?.miniButtons?.length || 0 }"
  >
    @for(miniBtn of config?.miniButtons ?? []; track $index) {
    <button
      mat-mini-fab
      class="mini-fab"
      [color]="config?.miniButtonColor || 'accent'"
      [matTooltip]="miniBtn.tooltip"
      [matTooltipPosition]="config?.tooltipPosition || 'left'"
      (click)="miniButtonClick($index)"
    >
      <mat-icon>{{ miniBtn.icon }}</mat-icon></button
    >}
  </div>
  }
</div>
