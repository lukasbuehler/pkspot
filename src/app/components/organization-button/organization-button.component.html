<a
  matButton="outlined"
  [routerLink]="[
    '/organizations',
    displayOrganization().slug || displayOrganization().id,
  ]"
>
  <span class="organization-button__content">
    <span
      class="organization-button__logo"
      [style.background]="displayOrganization().logo_background_color || null"
      aria-hidden="true"
    >
      @if (displayOrganization().logo_url; as logoUrl) {
        <img [src]="logoUrl" alt="" />
      } @else {
        <mat-icon>groups</mat-icon>
      }
    </span>
    <span class="mat-title-small organization-button__name">
      {{ displayOrganization().name }}
    </span>
    @if (verified()) {
      <mat-icon
        class="organization-button__verified"
        role="img"
        i18n-aria-label="@@event_host.verified"
        aria-label="Verified organizer"
        i18n-matTooltip="@@event_host.verified"
        matTooltip="Verified organizer"
        >verified</mat-icon
      >
    }
  </span>
</a>
