<h2 mat-dialog-title i18n="@@app_store_choice.title">Get PK Spot</h2>
<mat-dialog-content>
  <p i18n="@@app_store_choice.body">Choose the store for your device.</p>
  <div class="store-links">
    <a matButton="outlined" [href]="appLinks.appleAppStoreUrl" target="_blank" rel="noopener noreferrer">Apple App Store</a>
    <a matButton="outlined" [href]="appLinks.googlePlayStoreUrl" target="_blank" rel="noopener noreferrer">Google Play Store</a>
  </div>
  <p class="pwa-note" i18n="@@app_store_choice.pwa">PK Spot also works as a web app (PWA). Open pkspot.app in your device's browser and choose “Add to Home Screen” or “Install app”.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton mat-dialog-close i18n>Close</button>
</mat-dialog-actions>
