<h2 mat-dialog-title i18n>Publish Spot warning</h2>
<mat-dialog-content>
  <p i18n>
    This warning is public. Reporter identity and the original report remain
    private.
  </p>

  <mat-form-field appearance="outline">
    <mat-label i18n>Warning type</mat-label>
    <mat-select [formControl]="type">
      <mat-option value="destroyed" i18n>Destroyed</mat-option>
      <mat-option value="inaccessible" i18n>Inaccessible</mat-option>
      <mat-option value="temporarily_closed" i18n>
        Temporarily closed
      </mat-option>
      <mat-option value="access_concern" i18n>Access concern</mat-option>
      <mat-option value="other" i18n>Other</mat-option>
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label i18n>Public warning</mat-label>
    <textarea
      matInput
      rows="4"
      maxlength="240"
      [formControl]="message"
    ></textarea>
    <mat-hint align="end">{{ message.value.length }}/240</mat-hint>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton="outlined" type="button" [mat-dialog-close]="undefined">
    <span i18n>Cancel</span>
  </button>
  <button matButton="filled" type="button" (click)="publish()">
    <span i18n>Publish warning</span>
  </button>
</mat-dialog-actions>
