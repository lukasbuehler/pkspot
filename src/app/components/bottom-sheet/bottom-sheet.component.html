<div #bottomSheet class="sheet mat-elevation-z3">
  <div
    #handleRegion
    class="handle-region"
    (selectstart)="$event.preventDefault()"
    (contextmenu)="$event.preventDefault()"
    [class.content-at-top]="isContentAtTop()"
  >
    <div class="handle"></div>
  </div>

  <div #contentEl id="contentEl" class="content">
    <ng-content></ng-content>
  </div>
</div>
