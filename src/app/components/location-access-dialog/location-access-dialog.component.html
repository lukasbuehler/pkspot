<h2 mat-dialog-title i18n="@@locationAccess.title">Use device location?</h2>
<mat-dialog-content>
  <div class="location-access-dialog__icon"><mat-icon>location_on</mat-icon></div>
  <p i18n="@@locationAccess.explanation">
    PK Spot uses your device location to show your position and find nearby Spots. Your precise location is not stored or shared. When you explicitly check in, PK Spot privately records the Spot and time in your training history.
  </p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="enabling()" i18n="@@common.notNow">Not now</button>
  <button mat-button type="button" [disabled]="enabling()" (click)="enable('temporary')" i18n="@@locationAccess.temporary">Use for 5 minutes</button>
  <button mat-flat-button type="button" [disabled]="enabling()" (click)="enable('persistent')" i18n="@@locationAccess.persistent">Use while using the app</button>
</mat-dialog-actions>
