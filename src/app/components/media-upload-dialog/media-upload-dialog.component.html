<h2 mat-dialog-title i18n="@@add_media.label">Add media</h2>
<div mat-dialog-content>
  <app-media-upload
    [allowedMimeTypes]="allowedMimeTypes"
    [multipleAllowed]="multipleAllowed"
    [storageFolder]="storageFolder"
    [imageCropPolicy]="optionalMediaCropPolicy"
    [moderationTargetKind]="'spot'"
    [moderationTargetId]="data.spotId"
    [showUploadAction]="false"
    (changed)="onMediaChanged()"
    (mediaBatchUploaded)="onMediaBatchUploaded($event)"
    (isUploading)="onUploadingChange($event)"
  ></app-media-upload>
</div>
<div mat-dialog-actions class="d-flex justify-content-between">
  <button
    mat-button
    (click)="abort()"
  >
    @if (uploading()) {
      <span i18n>Abort</span>
    } @else if (hasPendingMedia()) {
      <span i18n>Discard</span>
    } @else {
      <span i18n>Cancel</span>
    }
  </button>

  <button
    mat-flat-button
    (click)="confirm()"
    [disabled]="uploading() || hasIncompleteRequiredCrop()"
  >
    <mat-icon>{{ hasPendingMedia() ? "upload" : "check" }}</mat-icon>
    @if (uploading()) {
      <span i18n>Uploading…</span>
    } @else if (hasPendingMedia()) {
      <span i18n>Upload</span>
    } @else {
      <span i18n>Close</span>
    }
  </button>
</div>
